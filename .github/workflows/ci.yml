name: CI

on:
  push:
  pull_request:

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep tests in the package
        run: sed -i '/^ignore:/,$d' .pkgmeta
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Collect the package
        run: |
          set -euo pipefail
          mkdir -p dist
          zipfile=$(find .release -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          cp "$zipfile" dist/
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  test:
    name: Lua 5.1
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 unzip
      - name: Test the package
        run: |
          set -euo pipefail
          zipfile=$(find package -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/DeltachessFramework"
          TEST_IGNORE_SLUGS=engine_consistency_integration lua5.1 Libs/LibUnitWow/run.lua tests Libs/LibChessOpeningBook/tests

  discover-engines:
    name: Discover Engines
    needs: package
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.list_engines.outputs.engines }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 unzip
      - name: List available engines
        id: list_engines
        run: |
          set -euo pipefail
          zipfile=$(find package -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/DeltachessFramework"
          ENGINES=$(lua5.1 bin/engines.lua)
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          lua5.1 bin/engines.lua --check

  engine-consistency:
    name: Engine Consistency (${{ matrix.engine }})
    needs: [package, discover-engines]
    if: needs.discover-engines.outputs.engines != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.discover-engines.outputs.engines) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 unzip
      - name: Run engine consistency tests for ${{ matrix.engine }}
        run: |
          set -euo pipefail
          zipfile=$(find package -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/DeltachessFramework"
          ALLOWED_ENGINES=${{ matrix.engine }} TEST_ONLY_SLUGS=engine_consistency_integration lua5.1 Libs/LibUnitWow/run.lua tests/integration
