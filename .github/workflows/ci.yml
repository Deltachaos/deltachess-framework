name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Keep tests in the package
        run: sed -i '/^ignore:/,$d' .pkgmeta
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Test the package
        run: |
          set -euo pipefail
          zipfile=$(find .release -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/DeltachessFramework"
          TEST_IGNORE_SLUGS=engine_consistency_integration lua5.1 Libs/LibUnitWow/run.lua

  discover-engines:
    name: Discover Engines
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.list_engines.outputs.engines }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: List available engines
        id: list_engines
        run: |
          ENGINES=$(lua5.1 bin/engines.lua)
          echo "engines=$ENGINES" >> $GITHUB_OUTPUT
          lua5.1 bin/engines.lua --check

  engine-consistency:
    name: Engine Consistency (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: discover-engines
    if: needs.discover-engines.outputs.engines != '[]'
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.discover-engines.outputs.engines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Keep tests in the package
        run: sed -i '/^ignore:/,$d' .pkgmeta
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Run engine consistency tests for ${{ matrix.engine }}
        run: |
          set -euo pipefail
          zipfile=$(find .release -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/DeltachessFramework"
          ALLOWED_ENGINES=${{ matrix.engine }} TEST_ONLY_SLUGS=engine_consistency_integration lua5.1 Libs/LibUnitWow/run.lua tests/integration
